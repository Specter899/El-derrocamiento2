<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiero Colaborar — GameHub Solidario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-danger" href="index.html"></a>
</nav>
<section class="container py-5" style="margin-top: 100px;">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card p-4" style="backdrop-filter: blur(8px); border:1px solid rgba(255,255,255,0.15);">
        
<h2 class="text-center texto-derrocamiento fw-bold mb-4">
  Comprar Juego
</h2>
        <form>
          <h5 class="text-danger fw-bold">Datos personales</h5>
          <div class="mb-3">
            <label class="form-label text-light">Nombre completo</label>
            <input type="text" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-light">Email</label>
            <input type="email" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label text-light">Teléfono</label>
            <input type="tel" class="form-control">
          </div>
          <hr class="text-light">
          <h5 class="text-danger fw-bold">Metodo de pago</h5>
          <select id="tipoColaboracion" class="form-select mb-3">
            <option value="" selected disabled>Elegir una opción...</option>
            <option value="dinero">Elegi tu metodo de pago</option>
          </select>
          <div id="seccionDinero" style="display:none;">
            <h6 class="fw-bold text-warning">Donación económica</h6>
            <div class="mb-3">
              <label class="form-label text-light">Tipo de aporte</label>
              <select class="form-select">
                <option>Único</option>
                <option>Mensual</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label text-light">Medio de pago</label>
              <select class="form-select">
                <option>MercadoPago</option>
                <option>Transferencia bancaria</option>
                <option>Criptomonedas</option>
              </select>
            </div>
            <hr class="text-light">
          </div>
          <div id="seccionTrabajo" style="display:none;">
            <h6 class="fw-bold text-warning">Voluntariado</h6>
            <div class="mb-3">
              <label class="form-label text-light">Rol deseado</label>
              <input type="text" class="form-control" placeholder="Ej: moderador, caster, organizador...">
            </div>
            <div class="mb-3">
              <label class="form-label text-light">Disponibilidad</label>
              <input type="text" class="form-control" placeholder="Ej: tardes, fines de semana...">
            </div>
            <div class="mb-3">
              <label class="form-label text-light">Zona</label>
              <input type="text" class="form-control" placeholder="Ej: Argentina, Chile, etc.">
            </div>
            <div class="mb-3">
              <label class="form-label text-light">Juego / plataforma preferida</label>
              <input type="text" class="form-control" placeholder="Valorant, LoL, CSGO...">
            </div>
            <hr class="text-light">
          </div>
          <div id="seccionDifusion" style="display:none;">
            <h6 class="fw-bold text-warning">Difusión</h6>
            <div class="mb-3">
              <label class="form-label text-light">Redes donde difundirás</label>
              <input type="text" class="form-control" placeholder="Ej: Instagram, TikTok, Twitter...">
            </div>
            <div class="mb-3">
              <label class="form-label text-light">Frecuencia</label>
              <select class="form-select">
                <option>Una vez</option>
                <option>Varias veces por semana</option>
                <option>A diario</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label text-light">Kit de prensa</label>
              <a href="#" class="btn btn-outline-danger w-100">Descargar kit</a>
            </div>
            <hr class="text-light">
          </div>
          <div class="d-flex justify-content-between">
            <a href="index.html" class="btn btn-secondary">Volver al Home</a>
            <button type="submit" class="btn btn-danger">Enviar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
<footer class="text-center text-light py-3 mt-5">
  <p class="mb-0">© 2025 GameHub Solidario — Proyecto educativo</p>
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
