<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Admin — GameHub Solidario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/aos@3.0.0-beta.6/dist/aos.css" rel="stylesheet">
</head>
<body>
    <header class="navbar navbar-dark bg-dark px-3" data-aos="fade-down">
        <a class="navbar-brand" href="index.html">GameHub Solidario</a>
        <span class="text-light fw-bold">Panel Admin</span>
    </header>
    <section class="container py-5 text-light" data-aos="fade-up">
        <h2 id="adminSaludo" class="text-center mb-4">Bienvenido/a</h2>
        <div class="row">
            <div class="col-md-6" data-aos="fade-right">
                <div class="card p-4 admin-panel">
                    <h4 class="text-danger mb-3">Crear Torneo / Campaña</h4>
                    <label class="mt-2">Título</label>
                    <input type="text" id="titulo" class="form-control">
                    <label class="mt-2">Juego</label>
                    <input type="text" id="juego" class="form-control">
                    <label class="mt-2">Plataforma</label>
                    <input type="text" id="plataforma" class="form-control">
                    <label class="mt-2">Fecha</label>
                    <input type="date" id="fecha" class="form-control">
                    <label class="mt-2">Cupos</label>
                    <input type="number" id="cupos" class="form-control">
                    <label class="mt-2">Objetivo Solidario</label>
                    <input type="text" id="objetivo" class="form-control">
                    <button onclick="agregarTorneo()" class="btn btn-danger w-100 mt-3">Agregar</button>
                </div>
            </div>
            <div class="col-md-6" data-aos="fade-left">
                <div class="card p-4 admin-panel">
                    <h4 class="text-danger mb-3">Listado de Torneos</h4>
                    <ul id="listaTorneos" class="list-group bg-transparent">
                    </ul>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <a href="index.html" class="btn btn-outline-light">Volver al Home</a>
        </div>
    </section>
    <footer class="bg-dark text-light text-center p-3 mt-5" data-aos="fade-up">
        <p class="mb-0">© 2025 GameHub Solidario — Panel de Administración</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/aos@3.0.0-beta.6/dist/aos.js"></script>
    <script>
      AOS.init({ duration: 1000, once: true });
    </script>
    <script src="js/admin.js"></script>
</body>
</html>
